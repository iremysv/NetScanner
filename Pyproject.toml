[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "NetScanner"
version = "1.0.0"
description = "Advanced Network Traffic and Security Analysis Platform"
authors = [
  { name="Irem Yasav" }
]
requires-python = ">=3.11"
dependencies = [
    # --- Paket Analizi ---
    "scapy>=2.5.0",
    "tqdm>=4.67",
    "requests>=2.34",
    # --- Web Sunucusu (FastAPI + ASGI) ---
    "fastapi>=0.136",
    "uvicorn>=0.46",
    "starlette>=1.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.28",
    "websockets>=16.0",
    # --- Nmap Entegrasyonu ---
    "python-nmap>=0.7",
    # --- Veri Doğrulama ---
    "pydantic>=2.13",
    # --- Yardımcı ---
    "colorama>=0.4",
    "rich>=15.0",
]

[project.optional-dependencies]
dev = [
    # --- Test ---
    "pytest>=9.0",
    "pytest-cov>=7.0",
    # --- Kod Kalitesi ---
    "mypy>=2.1",
    "black>=26.0",
    "flake8>=7.0",
    "bandit>=1.9",
]

[tool.pytest.ini_options]
testpaths = ["Tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["modules", "core", "reports"]
omit = ["venv/*", "Tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 40

[tool.mypy]
ignore_missing_imports = true
